<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Codex of the FORTY-EIGHT</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #080808;
  --paper: #e8e0d0;
  --paper-dark: #d4c9b5;
  --ink: #171512;
  --muted: #766f63;
  --accent: #a98b55;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 50% 20%, #252019 0%, transparent 45%),
    #080808;
  color: var(--paper);
  font-family: 'Cormorant Garamond', serif;
  min-height: 100vh;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .04;
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");
  z-index: 20;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px;
}

.header {
  position: fixed;
  top: 22px;
  left: 32px;
  right: 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 100;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #817764;
}

.header strong {
  color: #c2a875;
  font-weight: 500;
}

.book-stage {
  perspective: 2200px;
  width: min(92vw, 900px);
  height: min(72vh, 650px);
  position: relative;
}

.book {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
}

.page {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(105deg, rgba(0,0,0,.05), transparent 15%, transparent 85%, rgba(0,0,0,.08)),
    var(--paper);
  color: var(--ink);
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform 1s cubic-bezier(.65,.05,.36,1);
  box-shadow:
    0 10px 30px rgba(0,0,0,.3),
    inset 0 0 0 1px rgba(80,60,30,.12);
  overflow: hidden;
  cursor: pointer;
}

.page::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,.09), transparent 12%, transparent 88%, rgba(0,0,0,.04));
}

.page.flipped {
  transform: rotateY(-180deg);
}

.page-content {
  position: relative;
  z-index: 2;
  height: 100%;
  padding: clamp(32px, 5vw, 68px);
  display: flex;
  flex-direction: column;
  overflow: auto;
}

.page-content::-webkit-scrollbar {
  width: 3px;
}

.page-content::-webkit-scrollbar-thumb {
  background: #a49376;
}

.eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .2em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 20px;
}

h1 {
  font-size: clamp(38px, 6vw, 76px);
  line-height: .9;
  font-weight: 500;
  letter-spacing: -.045em;
  margin: 0;
  max-width: 700px;
}

h2 {
  font-size: clamp(28px, 4vw, 48px);
  line-height: .95;
  font-weight: 600;
  letter-spacing: -.035em;
  margin: 0 0 18px;
}

.subtitle {
  font-size: clamp(18px, 2vw, 26px);
  font-style: italic;
  color: #756a58;
  margin: 18px 0 34px;
}

.rule {
  width: 42px;
  height: 2px;
  background: var(--accent);
  margin: 0 0 25px;
}

.section-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: #927b51;
  margin-top: 24px;
  margin-bottom: 8px;
}

p {
  font-size: clamp(15px, 1.65vw, 19px);
  line-height: 1.48;
  margin: 0;
  max-width: 690px;
}

ul {
  padding-left: 20px;
  margin: 4px 0 0;
}

li {
  font-size: clamp(14px, 1.5vw, 17px);
  line-height: 1.45;
  margin-bottom: 7px;
}

.caution {
  margin-top: auto;
  padding-top: 22px;
  border-top: 1px solid rgba(80,60,30,.2);
}

.page-number {
  position: absolute;
  bottom: 24px;
  right: 34px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: #948873;
  letter-spacing: .1em;
}

.cover {
  background:
    radial-gradient(circle at 70% 25%, rgba(180,145,75,.18), transparent 30%),
    linear-gradient(135deg, #15130f, #292218);
  color: #e7dbc2;
}

.cover .eyebrow {
  color: #ad9463;
}

.cover h1 {
  font-size: clamp(48px, 8vw, 100px);
  text-transform: uppercase;
  letter-spacing: -.06em;
}

.cover .subtitle {
  color: #a99778;
}

.cover .rule {
  background: #a98b55;
}

.cover-mark {
  margin-top: auto;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .2em;
  color: #89734d;
}

.controls {
  position: fixed;
  bottom: 25px;
  display: flex;
  align-items: center;
  gap: 18px;
  z-index: 100;
}

button {
  border: 1px solid #393329;
  background: rgba(18,16,13,.8);
  color: #a99778;
  padding: 11px 18px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .1em;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  background: #292218;
  color: #e7dbc2;
}

button:disabled {
  opacity: .25;
  cursor: default;
}

.counter {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .12em;
  color: #746957;
  min-width: 80px;
  text-align: center;
}

@media (max-width: 600px) {
  body {
    overflow: hidden;
  }

  .app {
    padding: 15px;
  }

  .header {
    left: 18px;
    right: 18px;
    top: 16px;
    font-size: 8px;
  }

  .book-stage {
    width: 94vw;
    height: 74vh;
  }

  .page-content {
    padding: 30px 25px 42px;
  }

  .page-number {
    bottom: 15px;
    right: 20px;
  }

  .controls {
    bottom: 14px;
    gap: 8px;
  }

  button {
    padding: 9px 11px;
    font-size: 8px;
  }

  p {
    font-size: 15px;
    line-height: 1.42;
  }

  li {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <span>THE CODEX OF THE <strong>FORTY-EIGHT</strong></span>
    <span id="status">ARCHIVE / 001</span>
  </div>

  <div class="book-stage">
    <div class="book" id="book">

      <!-- PAGES INSERTED HERE -->

    </div>
  </div>

  <div class="controls">
    <button id="prev">← PREVIOUS</button>
    <div class="counter" id="counter">01 / 50</div>
    <button id="next">NEXT →</button>
  </div>

</div>

<script>
const pages = [...document.querySelectorAll('.page')];
let current = 0;

function updateBook() {
  pages.forEach((page, index) => {
    page.classList.toggle('flipped', index < current);
    page.style.zIndex = pages.length - index;
  });

  document.getElementById('counter').textContent =
    String(Math.min(current + 1, 50)).padStart(2, '0') + ' / 50';

  document.getElementById('status').textContent =
    'ARCHIVE / ' + String(Math.min(current + 1, 50)).padStart(3, '0');

  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current >= pages.length;
}

function nextPage() {
  if (current < pages.length) {
    current++;
    updateBook();
  }
}

function prevPage() {
  if (current > 0) {
    current--;
    updateBook();
  }
}

document.getElementById('next').onclick = nextPage;
document.getElementById('prev').onclick = prevPage;

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') nextPage();
  if (e.key === 'ArrowLeft') prevPage();
});

updateBook();
</script>

</body>
</html>
