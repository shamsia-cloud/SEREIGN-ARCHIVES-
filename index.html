<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sereign Archives</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0}
body{
  min-height:100vh;display:grid;place-items:center;
  background:#08090b;color:#eee;
  font-family:Inter,sans-serif;
  overflow:hidden;
}
main{text-align:center;padding:30px}
small{
  display:block;letter-spacing:.3em;text-transform:uppercase;
  font-size:10px;opacity:.5;margin-bottom:25px
}
h1{
  font:500 clamp(3.2rem,12vw,7rem)/.85 "Cormorant Garamond",serif;
  letter-spacing:-.04em;margin-bottom:18px
}
p{font-size:12px;opacity:.5;letter-spacing:.08em;margin-bottom:38px}
a{
  display:inline-flex;padding:14px 28px;
  border:1px solid #ffffff22;border-radius:100px;
  color:#fff;text-decoration:none;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;
  transition:.3s;
}
a:hover{background:#fff;color:#08090b;transform:translateY(-3px)}
</style>
</head>

<body>
<main>
  <small>Sereign Archives</small>
  <h1>Luminary</h1>
  <p>An archive beyond the ordinary.</p>
  <a href="https://luminary-archive-eta.vercel.app/">Enter Archive →</a>
</main>
</body>
</html>
